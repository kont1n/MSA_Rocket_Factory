name: Combined Reports

on:
  workflow_call:
    inputs:
      modules:
        required: true
        type: string
      go-version:
        required: true
        type: string
      golangci-lint-version:
        required: true
        type: string

jobs:
  combined-reports:
    name: Generate combined reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4.2.2

      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5.4.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: 🗄️ Cache Go modules
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-v1-go-${{ hashFiles('**/go.sum', 'go.work.sum') }}
          restore-keys: |
            ${{ runner.os }}-v1-go-

      - name: 🔄 Install dependencies
        run: |
          go work sync
          find . -name "go.mod" -type f | while read -r modfile; do
            dir=$(dirname "$modfile")
            echo "Processing module in: $dir"
            cd "$dir"
            go mod tidy
            cd - > /dev/null
          done

      - name: 📌 Install Task
        uses: arduino/setup-task@v2.0.0

      - name: 📌 Install gocov-html
        run: |
          go install github.com/axw/gocov/gocov@v1
          go install github.com/matm/gocov-html/cmd/gocov-html@v1

      - name: 🔍 Run Lint
        id: lint_step
        env:
          MODULES: ${{ inputs.modules }}
          GOLANGCI_LINT_VERSION: ${{ inputs.golangci-lint-version }}
        run: |
          echo "🔍 Запуск golangci-lint..."
          mkdir -p .github_pages/lint
          
          # Запускаем линт через Task и сохраняем результат
          set +e  # Отключаем автоматический выход при ошибке
          task lint > lint_output.txt 2>&1
          lint_exit_code=$?
          set -e  # Включаем обратно
          
          if [ $lint_exit_code -eq 0 ]; then
            echo "✅ Линт прошел успешно"
            echo "LINT_STATUS=success" >> $GITHUB_OUTPUT
            lint_result="success"
          else
            echo "❌ Найдены ошибки линтинга"
            echo "LINT_STATUS=failure" >> $GITHUB_OUTPUT 
            lint_result="failure"
          fi
          
          # Создаем HTML отчет линтинга
          cat > .github_pages/lint/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🔍 Lint Report</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #24292f;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: #ffffff;
                  }
                  .header {
                      text-align: center;
                      padding: 20px 0;
                      border-bottom: 2px solid #e1e4e8;
                      margin-bottom: 30px;
                  }
                  .status-success {
                      background: #dcfce7;
                      color: #15803d;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bbf7d0;
                  }
                  .status-failure {
                      background: #fef2f2;
                      color: #dc2626;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #fecaca;
                  }
                  .report-content {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 8px;
                      border: 1px solid #d1d9e0;
                      font-family: 'SF Mono', Consolas, monospace;
                      white-space: pre-wrap;
                      font-size: 14px;
                      overflow-x: auto;
                  }
                  .info {
                      background: #f0f9ff;
                      color: #0369a1;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bae6fd;
                      margin: 20px 0;
                  }
                  .navigation {
                      text-align: center;
                      margin: 30px 0;
                  }
                  .nav-link {
                      display: inline-block;
                      margin: 0 10px;
                      padding: 8px 16px;
                      background: #f6f8fa;
                      color: #24292f;
                      text-decoration: none;
                      border-radius: 6px;
                      border: 1px solid #d1d9e0;
                  }
                  .nav-link:hover {
                      background: #e1e4e8;
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>🔍 Lint Report</h1>
          EOF
          
          if [ "$lint_result" = "success" ]; then
              echo '        <div class="status-success">✅ Линтинг прошел успешно - ошибок не найдено</div>' >> .github_pages/lint/index.html
          else
              echo '        <div class="status-failure">❌ Обнаружены ошибки линтинга</div>' >> .github_pages/lint/index.html
          fi
          
          cat >> .github_pages/lint/index.html << 'EOF'
              </div>
              
              <div class="navigation">
                  <a href="../" class="nav-link">📊 Coverage Report</a>
                  <a href="../tests/" class="nav-link">🧪 Unit Tests</a>
                  <a href="../integration/" class="nav-link">🔗 Integration Tests</a>
                  <a href="./" class="nav-link">🔍 Lint Report</a>
                  <a href="../reports.html" class="nav-link">📋 All Reports</a>
              </div>
              
              <div class="info">
                  <strong>Отчет сгенерирован:</strong> 
          EOF
          
          echo "$(date)" >> .github_pages/lint/index.html
          echo '<br><strong>Commit:</strong> ${{ github.sha }}' >> .github_pages/lint/index.html
          echo '<br><strong>Branch:</strong> ${{ github.ref_name }}' >> .github_pages/lint/index.html
          
          cat >> .github_pages/lint/index.html << 'EOF'
              </div>
              
              <h2>📋 Результаты линтинга:</h2>
              <div class="report-content">
          EOF
          
          if [ -f lint_output.txt ]; then
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' lint_output.txt >> .github_pages/lint/index.html
          else
              echo "Результаты линтинга недоступны" >> .github_pages/lint/index.html
          fi
          
          cat >> .github_pages/lint/index.html << 'EOF'
              </div>
          </body>
          </html>
          EOF

      - name: 🧪 Run Tests
        id: test_step
        env:
          MODULES: ${{ inputs.modules }}
        run: |
          echo "🧪 Запуск unit тестов..."
          mkdir -p .github_pages/tests
          
          # Запускаем тесты через Task и сохраняем результат
          set +e  # Отключаем автоматический выход при ошибке
          task test > test_output.txt 2>&1
          test_exit_code=$?
          set -e  # Включаем обратно
          
          if [ $test_exit_code -eq 0 ]; then
            echo "✅ Тесты прошли успешно"
            echo "TEST_STATUS=success" >> $GITHUB_OUTPUT
            test_result="success"
          else
            echo "❌ Обнаружены ошибки в тестах"
            echo "TEST_STATUS=failure" >> $GITHUB_OUTPUT
            test_result="failure"
          fi
          
          # Создаем HTML отчет тестов
          cat > .github_pages/tests/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🧪 Test Report</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #24292f;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: #ffffff;
                  }
                  .header {
                      text-align: center;
                      padding: 20px 0;
                      border-bottom: 2px solid #e1e4e8;
                      margin-bottom: 30px;
                  }
                  .status-success {
                      background: #dcfce7;
                      color: #15803d;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bbf7d0;
                  }
                  .status-failure {
                      background: #fef2f2;
                      color: #dc2626;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #fecaca;
                  }
                  .report-content {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 8px;
                      border: 1px solid #d1d9e0;
                      font-family: 'SF Mono', Consolas, monospace;
                      white-space: pre-wrap;
                      font-size: 14px;
                      overflow-x: auto;
                  }
                  .info {
                      background: #f0f9ff;
                      color: #0369a1;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bae6fd;
                      margin: 20px 0;
                  }
                  .navigation {
                      text-align: center;
                      margin: 30px 0;
                  }
                  .nav-link {
                      display: inline-block;
                      margin: 0 10px;
                      padding: 8px 16px;
                      background: #f6f8fa;
                      color: #24292f;
                      text-decoration: none;
                      border-radius: 6px;
                      border: 1px solid #d1d9e0;
                  }
                  .nav-link:hover {
                      background: #e1e4e8;
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>🧪 Test Report</h1>
          EOF
          
          if [ "$test_result" = "success" ]; then
              echo '        <div class="status-success">✅ Все тесты прошли успешно</div>' >> .github_pages/tests/index.html
          else
              echo '        <div class="status-failure">❌ Обнаружены ошибки в тестах</div>' >> .github_pages/tests/index.html
          fi
          
          cat >> .github_pages/tests/index.html << 'EOF'
              </div>
              
              <div class="navigation">
                  <a href="../" class="nav-link">📊 Coverage Report</a>
                  <a href="./" class="nav-link">🧪 Unit Tests</a>
                  <a href="../integration/" class="nav-link">🔗 Integration Tests</a>
                  <a href="../lint/" class="nav-link">🔍 Lint Report</a>
                  <a href="../reports.html" class="nav-link">📋 All Reports</a>
              </div>
              
              <div class="info">
                  <strong>Отчет сгенерирован:</strong> 
          EOF
          
          echo "$(date)" >> .github_pages/tests/index.html
          echo '<br><strong>Commit:</strong> ${{ github.sha }}' >> .github_pages/tests/index.html
          echo '<br><strong>Branch:</strong> ${{ github.ref_name }}' >> .github_pages/tests/index.html
          
          # Извлекаем краткую статистику тестов из вывода
          test_summary=""
          if [ -f test_output.txt ]; then
            passed_count=$(grep -o "PASS.*" test_output.txt | wc -l | tr -d ' ')
            failed_count=$(grep -o "FAIL.*" test_output.txt | wc -l | tr -d ' ')
            
            if [ "$passed_count" -gt 0 ] || [ "$failed_count" -gt 0 ]; then
              test_summary="<br><strong>Пройдено:</strong> $passed_count <strong>Провалено:</strong> $failed_count"
            fi
          fi
          
          cat >> .github_pages/tests/index.html << EOF
              $test_summary
              </div>
              
              <h2>📋 Результаты тестирования:</h2>
              <div class="report-content">
          EOF
          
          if [ -f test_output.txt ]; then
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' test_output.txt >> .github_pages/tests/index.html
          else
              echo "Результаты тестирования недоступны" >> .github_pages/tests/index.html
          fi
          
          cat >> .github_pages/tests/index.html << 'EOF'
              </div>
          </body>
          </html>
          EOF

      - name: 📄 Генерация .env файлов
        env:
          SERVICES: "inventory,order,payment"
        run: |
          # Генерируем все .env файлы для сервисов
          echo "Генерация .env файлов для всех сервисов..."
          task env:generate

          # Проверяем результат
          echo "✅ Файлы .env для сервисов созданы"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🧩 Set up Docker cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: 📄 Подготовка окружения для тестов
        env:
          # PostgreSQL environment variables for tests
          POSTGRES_IMAGE_NAME: postgres:17.0-alpine3.20
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: order_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          HTTP_PORT: 8081
          # MongoDB environment variables for tests
          MONGO_IMAGE_NAME: mongo:7.0.5
          MONGO_HOST: mongo
          MONGO_PORT: 27017
          MONGO_DATABASE: inventory_service
          MONGO_INITDB_ROOT_USERNAME: inventory_service_user
          MONGO_INITDB_ROOT_PASSWORD: inventory_service_password
          GRPC_PORT: 50051
        run: |
          echo "📋 Проверка переменных окружения для интеграционных тестов..."
          echo "🐘 PostgreSQL: $POSTGRES_IMAGE_NAME на $POSTGRES_HOST:$POSTGRES_PORT"
          echo "🍃 MongoDB: $MONGO_IMAGE_NAME на $MONGO_HOST:$MONGO_PORT"
          echo "🔧 Порты: HTTP=$HTTP_PORT, gRPC=$GRPC_PORT"
          echo "✅ Окружение подготовлено для интеграционных тестов"

      - name: 📊 Run Integration Tests
        id: integration_test_step
        env:
          MODULES: ${{ inputs.modules }}
          # PostgreSQL environment variables for tests
          POSTGRES_IMAGE_NAME: postgres:17.0-alpine3.20
          POSTGRES_HOST: postgres
          POSTGRES_PORT: 5432
          POSTGRES_DATABASE: order_service
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          HTTP_PORT: 8081
          # MongoDB environment variables for tests
          MONGO_IMAGE_NAME: mongo:7.0.5
          MONGO_HOST: mongo
          MONGO_PORT: 27017
          MONGO_DATABASE: inventory_service
          MONGO_INITDB_ROOT_USERNAME: inventory_service_user
          MONGO_INITDB_ROOT_PASSWORD: inventory_service_password
          GRPC_PORT: 50051
        run: |
          echo "🧪 Запуск интеграционных тестов с расширенным логированием..."
          echo "📋 Модули: ${{ inputs.modules }}"
          echo "🕒 Время начала: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "🖥️ Runner: ${{ runner.os }}"
          mkdir -p .github_pages/integration
          
          # Показываем системную информацию
          echo ""
          echo "🔧 Системная информация:"
          echo "- Go версия: $(go version 2>/dev/null || echo 'не установлен')"
          echo "- Docker версия: $(docker --version 2>/dev/null || echo 'не установлен')"
          echo "- Доступная память: $(free -h | grep Mem | awk '{print $7}' 2>/dev/null || echo 'неизвестно')"
          echo "- Дисковое пространство: $(df -h / | tail -1 | awk '{print $4}' 2>/dev/null || echo 'неизвестно')"
          echo ""
          
          # Запускаем интеграционные тесты через Task и сохраняем результат
          echo "▶️ Выполняем команду: task test-integration"
          echo "========================================"
          set +e  # Отключаем автоматический выход при ошибке
          
          # Запускаем с детальным выводом и сохранением в файл
          task test-integration 2>&1 | tee integration_output.txt
          integration_exit_code=${PIPESTATUS[0]}
          set -e  # Включаем обратно
          
          echo "========================================"
          echo "🏁 Завершение интеграционных тестов"
          echo "📊 Код завершения: $integration_exit_code"
          echo "🕒 Время завершения: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          
          # Анализируем результаты тестирования
          if [ -f "integration_output.txt" ]; then
            total_tests=$(grep -c "=== RUN" integration_output.txt 2>/dev/null || echo "0")
            passed_tests=$(grep -c "PASS:" integration_output.txt 2>/dev/null || echo "0")
            failed_tests=$(grep -c "FAIL:" integration_output.txt 2>/dev/null || echo "0")
            
            echo ""
            echo "📈 СТАТИСТИКА ТЕСТИРОВАНИЯ:"
            echo "- Всего тестов запущено: $total_tests"
            echo "- Прошло успешно: $passed_tests"
            echo "- Провалено: $failed_tests"
            
            # Показываем детали провалившихся тестов
            if [ $failed_tests -gt 0 ]; then
              echo ""
              echo "❌ ДЕТАЛИ ПРОВАЛИВШИХСЯ ТЕСТОВ:"
              grep -A 10 -B 2 "FAIL:" integration_output.txt || echo "Детали ошибок не найдены"
            fi
          else
            echo "⚠️ Файл с результатами тестирования не найден"
          fi
          
          # Проверяем Docker контейнеры
          echo ""
          echo "🐳 СОСТОЯНИЕ DOCKER КОНТЕЙНЕРОВ:"
          docker ps -a 2>/dev/null || echo "Docker не доступен или нет контейнеров"
          
          if [ $integration_exit_code -eq 0 ]; then
            echo ""
            echo "✅ ВСЕ ИНТЕГРАЦИОННЫЕ ТЕСТЫ ПРОШЛИ УСПЕШНО!"
            echo "INTEGRATION_STATUS=success" >> $GITHUB_OUTPUT
            integration_result="success"
          else
            echo ""
            echo "💥 ОБНАРУЖЕНЫ ОШИБКИ В ИНТЕГРАЦИОННЫХ ТЕСТАХ!"
            echo "🔍 Детальная информация об ошибках выведена выше"
            
            # Дополнительная диагностика при ошибках
            echo ""
            echo "🔍 ДОПОЛНИТЕЛЬНАЯ ДИАГНОСТИКА:"
            
            # Показываем логи Docker контейнеров
            if command -v docker >/dev/null 2>&1; then
              echo "📋 Логи Docker контейнеров (последние 20 строк):"
              for container in $(docker ps -aq 2>/dev/null || echo ""); do
                if [ ! -z "$container" ]; then
                  container_name=$(docker inspect --format='{{.Name}}' $container 2>/dev/null | sed 's/\///' || echo "unknown")
                  echo "--- $container_name ($container) ---"
                  docker logs --tail=20 $container 2>&1 || echo "Не удалось получить логи"
                  echo ""
                fi
              done
            fi
            
            echo "INTEGRATION_STATUS=failure" >> $GITHUB_OUTPUT
            integration_result="failure"
          fi
          
          # Создаем HTML отчет интеграционных тестов
          cat > .github_pages/integration/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>🔗 Integration Test Report</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #24292f;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: #ffffff;
                  }
                  .header {
                      text-align: center;
                      padding: 20px 0;
                      border-bottom: 2px solid #e1e4e8;
                      margin-bottom: 30px;
                  }
                  .status-success {
                      background: #dcfce7;
                      color: #15803d;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bbf7d0;
                  }
                  .status-failure {
                      background: #fef2f2;
                      color: #dc2626;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #fecaca;
                  }
                  .report-content {
                      background: #f6f8fa;
                      padding: 20px;
                      border-radius: 8px;
                      border: 1px solid #d1d9e0;
                      font-family: 'SF Mono', Consolas, monospace;
                      white-space: pre-wrap;
                      font-size: 14px;
                      overflow-x: auto;
                  }
                  .info {
                      background: #f0f9ff;
                      color: #0369a1;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bae6fd;
                      margin: 20px 0;
                  }
                  .navigation {
                      text-align: center;
                      margin: 30px 0;
                  }
                  .nav-link {
                      display: inline-block;
                      margin: 0 10px;
                      padding: 8px 16px;
                      background: #f6f8fa;
                      color: #24292f;
                      text-decoration: none;
                      border-radius: 6px;
                      border: 1px solid #d1d9e0;
                  }
                  .nav-link:hover {
                      background: #e1e4e8;
                  }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>🔗 Integration Test Report</h1>
          EOF
          
          if [ "$integration_result" = "success" ]; then
              echo '        <div class="status-success">✅ Все интеграционные тесты прошли успешно</div>' >> .github_pages/integration/index.html
          else
              echo '        <div class="status-failure">❌ Обнаружены ошибки в интеграционных тестах</div>' >> .github_pages/integration/index.html
          fi
          
          cat >> .github_pages/integration/index.html << 'EOF'
              </div>
              
              <div class="navigation">
                  <a href="../" class="nav-link">📊 Coverage Report</a>
                  <a href="../tests/" class="nav-link">🧪 Unit Tests</a>
                  <a href="./" class="nav-link">🔗 Integration Tests</a>
                  <a href="../lint/" class="nav-link">🔍 Lint Report</a>
                  <a href="../reports.html" class="nav-link">📋 All Reports</a>
              </div>
              
              <div class="info">
                  <strong>Отчет сгенерирован:</strong> 
          EOF
          
          echo "$(date)" >> .github_pages/integration/index.html
          echo '<br><strong>Commit:</strong> ${{ github.sha }}' >> .github_pages/integration/index.html
          echo '<br><strong>Branch:</strong> ${{ github.ref_name }}' >> .github_pages/integration/index.html
          
          # Извлекаем краткую статистику тестов из вывода
          integration_summary=""
          if [ -f integration_output.txt ]; then
            passed_count=$(grep -o "PASS.*" integration_output.txt | wc -l | tr -d ' ')
            failed_count=$(grep -o "FAIL.*" integration_output.txt | wc -l | tr -d ' ')
            
            if [ "$passed_count" -gt 0 ] || [ "$failed_count" -gt 0 ]; then
              integration_summary="<br><strong>Пройдено:</strong> $passed_count <strong>Провалено:</strong> $failed_count"
            fi
          fi
          
          cat >> .github_pages/integration/index.html << EOF
              $integration_summary
              </div>
              
              <h2>📋 Результаты интеграционного тестирования:</h2>
              <div class="report-content">
          EOF
          
          if [ -f integration_output.txt ]; then
              sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' integration_output.txt >> .github_pages/integration/index.html
          else
              echo "Результаты интеграционного тестирования недоступны" >> .github_pages/integration/index.html
          fi
          
          cat >> .github_pages/integration/index.html << 'EOF'
              </div>
          </body>
          </html>
          EOF

      - name: 🧹 Cleanup Docker containers
        if: always()
        run: |
          echo "🧹 Cleaning up dangling containers..."
          docker container prune -f

      - name: 📊 Run Coverage
        run: |
          echo "📊 Генерация отчета покрытия бизнес-логики..."
          mkdir -p .github_pages
          
          # Используем готовую Task команду для генерации покрытия
          if task test-coverage > coverage_output.txt 2>&1; then
            echo "✅ Покрытие успешно сгенерировано"
            
            # Проверяем правильный путь к файлу покрытия
            COVERAGE_FILE="coverage/total.out"
            if [ -f "$COVERAGE_FILE" ] && [ -s "$COVERAGE_FILE" ]; then
              echo "📁 Найден файл покрытия: $COVERAGE_FILE"
              cp "$COVERAGE_FILE" coverage.out
              
              # Генерируем функциональный отчет
              if go tool cover -func=coverage.out > cover.out 2>&1; then
                echo "✅ Функциональный отчет создан"
                
                # Показываем итоговое покрытие
                echo "📈 Итоговое покрытие бизнес-логики:"
                tail -1 cover.out
                
                # Генерируем HTML отчет
                echo "🌐 Генерация HTML отчета..."
                if gocov convert coverage.out | gocov-html > .github_pages/index.html 2>&1; then
                  echo "✅ HTML отчет создан"
                  
                  # Добавляем навигацию к HTML отчету покрытия
                  sed -i '/<\/head>/i\
                  <style>\
                  .navigation {\
                    position: fixed;\
                    top: 10px;\
                    right: 10px;\
                    background: white;\
                    padding: 10px;\
                    border: 1px solid #ccc;\
                    border-radius: 5px;\
                    box-shadow: 0 2px 5px rgba(0,0,0,0.2);\
                    z-index: 1000;\
                  }\
                  .nav-link {\
                    display: inline-block;\
                    margin: 0 5px;\
                    padding: 5px 10px;\
                    background: #f6f8fa;\
                    color: #24292f;\
                    text-decoration: none;\
                    border-radius: 3px;\
                    border: 1px solid #d1d9e0;\
                    font-size: 12px;\
                  }\
                  .nav-link:hover {\
                    background: #e1e4e8;\
                  }\
                  </style>' .github_pages/index.html
                  
                  sed -i '/<body>/a\
                  <div class="navigation">\
                    <a href="./" class="nav-link">📊 Coverage</a>\
                    <a href="./tests/" class="nav-link">🧪 Unit Tests</a>\
                    <a href="./integration/" class="nav-link">🔗 Integration Tests</a>\
                    <a href="./lint/" class="nav-link">🔍 Lint</a>\
                    <a href="./reports.html" class="nav-link">📋 All Reports</a>\
                  </div>' .github_pages/index.html
                else
                  echo "❌ Ошибка создания HTML отчета"
                  echo "<html><body><h1>Failed to generate coverage report</h1><p>Check logs for details</p></body></html>" > .github_pages/index.html
                fi
              else
                echo "❌ Ошибка создания функционального отчета"
                cat cover.out
                echo "total:                  (statements)   0.0%" > cover.out
                echo "<html><body><h1>Failed to generate coverage report</h1><p>Error generating function report</p></body></html>" > .github_pages/index.html
              fi
            else
              echo "⚠️ Файл покрытия не найден или пустой: $COVERAGE_FILE"
              echo "🔍 Проверяем альтернативные пути..."
              
              # Проверяем другие возможные файлы покрытия
              for alt_file in "coverage/coverage.out" "coverage.out" "final_coverage.out"; do
                if [ -f "$alt_file" ] && [ -s "$alt_file" ]; then
                  echo "✅ Найден альтернативный файл покрытия: $alt_file"
                  cp "$alt_file" coverage.out
                  
                  # Генерируем функциональный отчет
                  if go tool cover -func=coverage.out > cover.out 2>&1; then
                    echo "✅ Функциональный отчет создан из $alt_file"
                    
                    # Показываем итоговое покрытие
                    echo "📈 Итоговое покрытие бизнес-логики:"
                    tail -1 cover.out
                    
                    # Генерируем HTML отчет
                    echo "🌐 Генерация HTML отчета..."
                    if gocov convert coverage.out | gocov-html > .github_pages/index.html 2>&1; then
                      echo "✅ HTML отчет создан"
                      
                      # Добавляем навигацию к HTML отчету покрытия
                      sed -i '/<\/head>/i\
                      <style>\
                      .navigation {\
                        position: fixed;\
                        top: 10px;\
                        right: 10px;\
                        background: white;\
                        padding: 10px;\
                        border: 1px solid #ccc;\
                        border-radius: 5px;\
                        box-shadow: 0 2px 5px rgba(0,0,0,0.2);\
                        z-index: 1000;\
                      }\
                      .nav-link {\
                        display: inline-block;\
                        margin: 0 5px;\
                        padding: 5px 10px;\
                        background: #f6f8fa;\
                        color: #24292f;\
                        text-decoration: none;\
                        border-radius: 3px;\
                        border: 1px solid #d1d9e0;\
                        font-size: 12px;\
                      }\
                      .nav-link:hover {\
                        background: #e1e4e8;\
                      }\
                      </style>' .github_pages/index.html
                      
                      sed -i '/<body>/a\
                      <div class="navigation">\
                        <a href="./" class="nav-link">📊 Coverage</a>\
                        <a href="./tests/" class="nav-link">🧪 Unit Tests</a>\
                        <a href="./integration/" class="nav-link">🔗 Integration Tests</a>\
                        <a href="./lint/" class="nav-link">🔍 Lint</a>\
                        <a href="./reports.html" class="nav-link">📋 All Reports</a>\
                      </div>' .github_pages/index.html
                      break
                    else
                      echo "❌ Ошибка создания HTML отчета"
                    fi
                  else
                    echo "❌ Ошибка создания функционального отчета из $alt_file"
                  fi
                fi
              done
              
              # Если ни один файл не найден, создаем заглушку
              if [ ! -f "coverage.out" ]; then
                echo "❌ Не удалось найти файл покрытия"
                echo "total:                  (statements)   0.0%" > cover.out
                echo "<html><body><h1>No coverage data available</h1><p>No coverage file generated</p></body></html>" > .github_pages/index.html
              fi
            fi
          else
            echo "❌ Ошибка генерации покрытия"
            cat coverage_output.txt
            echo "total:                  (statements)   0.0%" > cover.out
            echo "<html><body><h1>Coverage generation failed</h1><p>Check logs for details</p></body></html>" > .github_pages/index.html
          fi
          
          # Показываем отладочную информацию
          echo "🔍 Финальная отладочная информация:"
          echo "coverage.out размер: $(ls -la coverage.out 2>/dev/null || echo 'не найден')"
          echo "cover.out содержимое:"
          cat cover.out 2>/dev/null || echo "cover.out не найден"
          echo "📁 Содержимое директории coverage/:"
          ls -la coverage/ 2>/dev/null || echo "директория coverage/ не найдена"

      - name: 🔗 Create main reports index
        run: |
          # Создаем главную страницу с навигацией между отчетами
          cat > .github_pages/reports.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>📊 Reports Dashboard</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                      line-height: 1.6;
                      color: #24292f;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 20px;
                      background: #ffffff;
                  }
                  .header {
                      text-align: center;
                      padding: 20px 0;
                      border-bottom: 2px solid #e1e4e8;
                      margin-bottom: 30px;
                  }
                  .reports-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 20px;
                      margin: 30px 0;
                  }
                  .report-card {
                      background: #f6f8fa;
                      border: 1px solid #d1d9e0;
                      border-radius: 8px;
                      padding: 20px;
                      text-align: center;
                      transition: box-shadow 0.2s;
                  }
                  .report-card:hover {
                      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                  }
                  .report-link {
                      display: block;
                      color: #0969da;
                      text-decoration: none;
                      font-weight: 600;
                      font-size: 18px;
                      margin: 10px 0;
                  }
                  .report-link:hover {
                      text-decoration: underline;
                  }
                  .report-desc {
                      color: #656d76;
                      font-size: 14px;
                  }
                  .info {
                      background: #f0f9ff;
                      color: #0369a1;
                      padding: 12px 20px;
                      border-radius: 8px;
                      border: 1px solid #bae6fd;
                      margin: 20px 0;
                      text-align: center;
                  }
                  .status-overview {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                      gap: 15px;
                      margin: 20px 0;
                  }
                  .status-item {
                      padding: 10px;
                      border-radius: 6px;
                      text-align: center;
                      font-weight: 600;
                  }
                  .status-success { background: #dcfce7; color: #15803d; }
                  .status-failure { background: #fef2f2; color: #dc2626; }
              </style>
          </head>
          <body>
              <div class="header">
                  <h1>📊 MSA Rocket Factory - Reports Dashboard</h1>
              </div>
              
              <div class="info">
                  <strong>Последнее обновление:</strong> $(date)<br>
                  <strong>Commit:</strong> ${{ github.sha }}<br>
                  <strong>Branch:</strong> ${{ github.ref_name }}
              </div>
              
              <div class="status-overview">
                  <div class="status-item $([[ "${{ steps.lint_step.outputs.LINT_STATUS }}" == "success" ]] && echo "status-success" || echo "status-failure")">
                      🔍 Lint: ${{ steps.lint_step.outputs.LINT_STATUS }}
                  </div>
                  <div class="status-item $([[ "${{ steps.test_step.outputs.TEST_STATUS }}" == "success" ]] && echo "status-success" || echo "status-failure")">
                      🧪 Unit Tests: ${{ steps.test_step.outputs.TEST_STATUS }}
                  </div>
                  <div class="status-item $([[ "${{ steps.integration_test_step.outputs.INTEGRATION_STATUS }}" == "success" ]] && echo "status-success" || echo "status-failure")">
                      🔗 Integration Tests: ${{ steps.integration_test_step.outputs.INTEGRATION_STATUS }}
                  </div>
                  <div class="status-item status-success">
                      📊 Coverage: Generated
                  </div>
              </div>
              
              <div class="reports-grid">
                  <div class="report-card">
                      <h2>📊</h2>
                      <a href="./" class="report-link">Coverage Report</a>
                      <p class="report-desc">Отчет о покрытии кода тестами с детальной информацией по файлам и функциям</p>
                  </div>
                  
                  <div class="report-card">
                      <h2>🧪</h2>
                      <a href="./tests/" class="report-link">Unit Test Report</a>
                      <p class="report-desc">Результаты выполнения unit тестов по всем модулям проекта</p>
                  </div>
                  
                  <div class="report-card">
                      <h2>🔗</h2>
                      <a href="./integration/" class="report-link">Integration Test Report</a>
                      <p class="report-desc">Результаты выполнения интеграционных тестов с реальными зависимостями</p>
                  </div>
                  
                  <div class="report-card">
                      <h2>🔍</h2> 
                      <a href="./lint/" class="report-link">Lint Report</a>
                      <p class="report-desc">Результаты статического анализа кода с помощью golangci-lint</p>
                  </div>
              </div>
              
              <div style="text-align: center; margin-top: 40px; color: #656d76;">
                  <p>🚀 Generated by MSA Rocket Factory CI/CD Pipeline</p>
              </div>
          </body>
          </html>
          EOF

      # Update coverage badge
      - name: Update coverage Badge
        if: github.ref == 'refs/heads/main'
        uses: tj-actions/coverage-badge-go@v2
        with:
          filename: cover.out
          green: 80
          yellow: 40
          target: README.md

      - name: Verify Changed files
        if: github.ref == 'refs/heads/main'
        uses: tj-actions/verify-changed-files@v12
        id: verify-changed-files
        with:
          files: README.md

      - name: Commit changes
        if: github.ref == 'refs/heads/main' && steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git commit -m "chore: Updated coverage badge."

      - name: Push changes
        if: github.ref == 'refs/heads/main' && steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}

      # Pages setup and deployment
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github_pages/

      - name: Upload Combined Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-reports
          path: |
            .github_pages/
            coverage.out
            cover.out
            lint_output.txt
            test_output.txt
            integration_output.txt
          retention-days: 30

      # Проверяем итоговый статус CI
      - name: 🔍 Check CI Status
        run: |
          echo "📊 Проверка итогового статуса CI..."
          
          LINT_STATUS="${{ steps.lint_step.outputs.LINT_STATUS }}"
          TEST_STATUS="${{ steps.test_step.outputs.TEST_STATUS }}"
          INTEGRATION_STATUS="${{ steps.integration_test_step.outputs.INTEGRATION_STATUS }}"
          
          echo "🔍 Статус линтинга: $LINT_STATUS"
          echo "🧪 Статус unit тестов: $TEST_STATUS"
          echo "🔗 Статус интеграционных тестов: $INTEGRATION_STATUS"
          
          # Определяем общий статус
          if [[ "$LINT_STATUS" == "failure" ]] || [[ "$TEST_STATUS" == "failure" ]] || [[ "$INTEGRATION_STATUS" == "failure" ]]; then
            echo "❌ CI провален из-за ошибок в линтинге или тестах"
            echo "📊 Отчеты всё равно будут созданы и опубликованы"
            exit 1
          else
            echo "✅ Все проверки CI прошли успешно"
          fi

  deploy:
    needs: combined-reports  
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pages: write
      id-token: write

    # Деплоим только для main ветки, даже если CI провален (отчеты всё равно нужны)
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Check deployment status
        if: steps.deployment.outcome == 'success'
        run: |
          echo "✅ Combined reports successfully deployed to GitHub Pages"
          echo "📊 Reports available at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

      - name: Deployment failed notice
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "⚠️ GitHub Pages deployment failed"
          echo "📋 Reports are available as an artifact: combined-reports" 